<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicVerse AI | Crear Cuenta</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<!-- ======================
        NAVBAR
====================== -->

<header class="navbar">

    <div class="logo">
        📚 ComicVerse AI
    </div>

    <nav>

        <a href="index.html">🏠 Inicio</a>

        <a href="comics.html">📖 Cómics</a>

        <a href="login.html">🔑 Iniciar sesión</a>

    </nav>

</header>





<!-- ======================
      REGISTRO
====================== -->

<section class="auth-container">

    <div class="auth-card">

        <h1>Crear cuenta</h1>

        <p>
            Únete a ComicVerse AI y descubre miles de historias.
        </p>


        <form id="registerForm">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre completo"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Correo electrónico"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirmar contraseña"
                required
            >

            <button
                type="submit"
                class="btn"
            >

                Crear cuenta 🚀

            </button>

        </form>


        <p class="login-link">

            ¿Ya tienes una cuenta?

            <a href="login.html">

                Inicia sesión

            </a>

        </p>

    </div>

</section>





<footer>

    © 2026 ComicVerse AI | Plataforma de cómics digitales

</footer>


<script type="module" src="js/auth/register.js"></script>

</body>

</html>
